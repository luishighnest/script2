[project]
name = "dazn-navigator2"
version = "1.0.0"
description = "Login, navigazione ed estrazione contenuti DAZN"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.9.0",
    "rich>=13.7.0",
    "pydantic>=2.5.3",
    "pydantic-settings>=2.1.0",
    "playwright>=1.40.0",
    "python-dotenv>=1.0.0",
    "pywidevine>=1.8.0",
    "curl_cffi>=0.7.4",
]

[project.scripts]
dazn2 = "dazn_navigator2.main:app"
dason = "dazn_navigator2.main:app"
mpd = "dazn_navigator2.main:app"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages]
find = {include = ["dazn_navigator2", "dazn_navigator2.*"]}