<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Script2</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0d1117;
            --card-bg: #161b22;
            --border-color: #30363d;
            --accent-yellow: #f8e71c;
            --text-main: #c9d1d9;
        }
        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .auth-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            width: 100%;
            max-width: 420px;
            padding: 35px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
        }
        .btn-dazn {
            background-color: var(--accent-yellow);
            color: #000;
            font-weight: 700;
            border: none;
        }
        .btn-dazn:hover {
            background-color: #e5d414;
            color: #000;
        }
    </style>
</head>
<body>
    <div class="auth-card">
        <div class="text-center mb-4">
            <i class="fa-solid fa-lock fa-3x text-warning mb-3"></i>
            <h3 class="fw-bold text-white">Accesso Riservato</h3>
            <p class="text-secondary small">Inserisci la password profilo per accedere a <code>/script</code></p>
        </div>
        {% if error %}
        <div class="alert alert-danger py-2 small"><i class="fa-solid fa-circle-exclamation me-2"></i>{{ error }}</div>
        {% endif %}
        <form method="POST" action="/login">
            <div class="mb-3">
                <label class="form-label text-secondary small">Password Profilo</label>
                <input type="password" name="password" class="form-control bg-dark text-white border-secondary" placeholder="Password..." required autofocus>
            </div>
            <button type="submit" class="btn btn-dazn w-100 py-2">
                <i class="fa-solid fa-arrow-right-to-bracket me-2"></i>Accedi a /script
            </button>
        </form>
    </div>
</body>
</html>
